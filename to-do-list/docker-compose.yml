version: "3.8"
services:
  app:
    build: .
    container_name: lista-de-tarefas-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command:
      [
        "poetry",
        "run",
        "uvicorn",
        "app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
  # "cérebro do kafka"
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tarefas-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # operador/operacional
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tarefas-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: tarefas-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # gerar localhost/site para visualizar
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tarefas-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092
